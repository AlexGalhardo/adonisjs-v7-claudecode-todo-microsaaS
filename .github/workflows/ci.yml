name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: |
          cp .env.example .env
          node ace generate:key
          # RESEND_API_KEY has no default in .env.example (it's a secret) — a
          # dummy value is fine here since mail-sending tests use mail.fake()
          # and never make a real network call.
          sed -i 's/^RESEND_API_KEY=$/RESEND_API_KEY=re_ci_dummy_key/' .env

      - name: Run migrations (test database)
        run: NODE_ENV=test node ace migration:run

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
